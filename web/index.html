<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12363d">
<title>Lost Cities</title>
<link rel="preload" href="fonts/gaegu-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 상품 아이콘: 노랑 향신료 자루, 파랑 도자기, 하양 비단, 초록 옥, 빨강 보석. 투자 = 금화. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="g-yellow" viewBox="0 0 24 24">
      <path d="M8.1 2.6c1 .9 2.3 1.4 3.9 1.4s2.9-.5 3.9-1.4l.9 3.1c-.6.5-1.3.9-2 1.2 3 1.5 5.2 4.5 5.2 8.2 0 4.2-3.4 7.3-8 7.3s-8-3.1-8-7.3c0-3.7 2.2-6.7 5.2-8.2-.7-.3-1.4-.7-2-1.2l.9-3.1z"/>
      <path d="M8.4 7.6c1 .5 2.2.8 3.6.8s2.6-.3 3.6-.8" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="g-blue" viewBox="0 0 24 24">
      <path d="M9 2.4h6v2.5c0 .9.4 1.5 1.3 2.2 1.8 1.3 2.7 3.2 2.7 5.4 0 4.6-3 8.6-7 8.6s-7-4-7-8.6c0-2.2.9-4.1 2.7-5.4C8.6 6.4 9 5.8 9 4.9V2.4z"/>
      <path d="M6.3 11.4h11.4M7.3 15h9.4" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="g-white" viewBox="0 0 24 24">
      <path d="M7 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7a4 7 0 0 1 0-14z"/>
      <path d="M7 5a4 7 0 0 0 0 14M7 8.8a1.5 3.2 0 0 0 0 6.4" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M13 5v14" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.2" stroke-dasharray="1.2 2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="g-green" viewBox="0 0 24 24">
      <path fill-rule="evenodd" d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm0 6.4a3.1 3.1 0 1 1 0 6.2 3.1 3.1 0 0 1 0-6.2z"/>
      <circle cx="12" cy="12" r="6.4" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="1.1"/>
    </symbol>
    <symbol id="g-red" viewBox="0 0 24 24">
      <path d="M7.4 3.6h9.2L21 9.2 12 20.6 3 9.2l4.4-5.6z"/>
      <path d="M3 9.2h18M9.1 3.6 12 9.2l2.9-5.6M12 9.2v11.4" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="g-coin" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.6"/>
      <circle cx="12" cy="12" r="6.7" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.3"/>
      <path d="M12 7.7l1.2 3.1 3.1 1.2-3.1 1.2L12 16.3l-1.2-3.1L7.7 12l3.1-1.2z" fill="rgba(0,0,0,.34)"/>
    </symbol>
    <symbol id="g-compass" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.4" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <path d="M16.6 7.4l-2.7 6.5-6.5 2.7 2.7-6.5z"/>
      <circle cx="12" cy="12" r="1.3" fill="#12363d"/>
      <path d="M12 1.6v2.2M12 20.2v2.2M1.6 12h2.2M20.2 12h2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <header class="topbar">
    <div class="title">
      <svg class="ic logo" aria-hidden="true"><use href="#g-compass"/></svg>
      <span class="name">Lost Cities</span>
      <small>교역 상단</small>
    </div>
    <div class="totals">
      <span class="coin-pill"><svg class="ic coin" aria-hidden="true"><use href="#g-coin"/></svg>나 <b id="total-me">0</b></span>
      <span class="coin-pill"><svg class="ic coin" aria-hidden="true"><use href="#g-coin"/></svg>AI <b id="total-ai">0</b></span>
    </div>
    <label class="ai-pick">AI
      <select id="ai-select">
        <option value="mcts">MCTS</option>
        <option value="rule">규칙 봇</option>
        <option value="random">랜덤</option>
      </select>
    </label>
    <button id="btn-analysis" class="btn small" type="button" aria-pressed="false">분석</button>
    <button id="btn-new" class="btn small" type="button">새 게임</button>
  </header>

  <section class="side opp" aria-label="AI 거래소">
    <div class="side-label">AI 거래소 <span id="opp-hand-count"></span></div>
    <div class="expeditions" id="opp-exps"></div>
  </section>

  <section class="middle" aria-label="장터와 창고">
    <div class="side-label market">장터</div>
    <div class="piles" id="piles"></div>
    <button class="deck" id="deck" type="button" aria-label="창고">
      <span class="deck-count" id="deck-count">44</span>
      <span class="deck-label">창고</span>
    </button>
  </section>

  <section class="side me" aria-label="내 거래소">
    <div class="side-label">내 거래소</div>
    <div class="expeditions" id="my-exps"></div>
  </section>

  <div class="status">
    <div id="message" class="message" aria-live="polite"></div>
    <div class="actions" id="actions"></div>
  </div>

  <section class="hand" id="hand" aria-label="내 손패"></section>

  <div class="known" id="known"></div>

  <section class="analysis" id="analysis" hidden aria-label="분석">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="moves">수 분석</button>
      <button type="button" role="tab" data-tab="tracker">카드 추적</button>
      <button type="button" role="tab" data-tab="score">점수 내역</button>
    </div>
    <div class="tab-body" id="tab-moves" role="tabpanel">
      <div class="analysis-head">
        <button class="btn primary small" id="btn-analyze" type="button">이 국면 분석</button>
        <span class="muted" id="analysis-status"></span>
      </div>
      <div id="moves-table"></div>
      <p class="note">순위는 수읽기(MCTS: 상대 손패를 관측과 모순 없이 여러 번 샘플링해 몇 수 앞까지 둬 본 결과) 기준. "비슷함"은 1.5점 이내라 어느 쪽을 둬도 큰 차이가 없다는 뜻. "이 수가 하는 일"은 정적 평가(위의 예상 최종 점수 계산)로 낸 것이고, "차이"는 수읽기 결과를 색별로 나눈 것이라 항목을 더하면 점수 차와 같다.</p>
    </div>
    <div class="tab-body" id="tab-tracker" role="tabpanel" hidden>
      <div class="muted" id="tracker-summary"></div>
      <table class="tracker" id="tracker-table"></table>
      <div class="legend" id="tracker-legend"></div>
    </div>
    <div class="tab-body" id="tab-score" role="tabpanel" hidden>
      <table class="breakdown" id="breakdown-table"></table>
    </div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel">
    <h2 id="result-title" class="stamp"></h2>
    <table class="result" id="result-table"></table>
    <div class="reveal"><div class="reveal-label">AI 남은 손패</div><div class="mini-row" id="ai-hand"></div></div>
    <div class="panel-actions">
      <button class="btn" id="btn-close" type="button">판 보기</button>
      <button class="btn primary" id="btn-again" type="button">새 게임</button>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
